name: soap-output-batch-size
version: 1.0.0
description: Split a batched SOAP output into requests of at most 50 records.
tags:
  - soap
  - soap-output
input:
  type: webhook
  path: /webhooks/orders
filters: []
output:
  type: soapRequest
  endpoint: https://soap.example.com/import
  soapAction: urn:ImportOrders
  operation: ImportOrders
  requestMode: batch
  batchSize: 50
  onError: fail
  body: |
    <m:ImportOrders xmlns:m="urn:orders">
      <m:RecordCount>{{record.recordCount}}</m:RecordCount>
      {%- for order in record.records %}
      <m:Order>
        <m:Id>{{order.orderId | default('')}}</m:Id>
      </m:Order>
      {%- endfor %}
    </m:ImportOrders>
  success:
    statusCodes:
      - 200
      - 202
