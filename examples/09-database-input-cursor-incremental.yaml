name: database-input-cursor-incremental
version: 1.0.0
description: Read database rows incrementally using cursor pagination metadata.
tags:
  - database-input
  - incremental
input:
  type: database
  connectionStringRef: ${SOURCE_DATABASE_URL}
  driver: postgres
  query: |
    select id, customer_id, total, updated_at
    from orders
    where updated_at > $1
      and id > $2
    order by id asc
    limit $3
  parameters:
    - state.lastRunTimestamp
    - pagination.cursor ?? state.lastRunId ?? 0
    - pagination.limit
  pagination:
    type: cursor
    limit: 200
    cursorField: id
  incremental:
    enabled: true
    timestampField: updated_at
    idField: id
filters:
  - type: mapping
    mappings:
      - source: id
        target: order.id
      - source: customer_id
        target: order.customerId
      - source: total
        target: order.total
        transforms:
          - op: toFloat
output:
  type: httpRequest
  endpoint: https://destination.example.com/api/orders
  method: POST
  requestMode: batch
