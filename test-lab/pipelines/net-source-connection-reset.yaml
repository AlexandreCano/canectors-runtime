name: net-source-connection-reset
version: 1.0.0
description: "Source resets the TCP connection."
tags:
  - test-lab
  - network
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/network/source/connection-reset
  dataField: data
  retry:
    maxAttempts: 0
filters: []
output:
  type: httpRequest
  endpoint: http://localhost:18080/destination/network/sink
  method: POST
  headers:
    Content-Type: application/json
