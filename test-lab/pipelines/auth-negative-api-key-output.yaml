name: auth-negative-api-key-output
version: 1.0.0
description: Wrong API key on the destination — 401, pipeline error.
tags:
  - test-lab
  - auth
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/auth/source/orders
  dataField: orders
filters: []
output:
  type: httpRequest
  endpoint: http://localhost:18080/auth/destination/orders
  method: POST
  headers:
    Content-Type: application/json
  authentication:
    type: api-key
    credentials:
      key: wrong-destination-key
      location: header
      headerName: X-API-Key
