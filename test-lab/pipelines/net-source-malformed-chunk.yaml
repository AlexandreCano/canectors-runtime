name: net-source-malformed-chunk
version: 1.0.0
description: "Source sends a malformed chunk mid-body."
tags:
  - test-lab
  - network
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/network/source/malformed-chunk
  dataField: data
  retry:
    maxAttempts: 0
filters: []
output:
  type: httpRequest
  endpoint: http://localhost:18080/destination/network/sink
  method: POST
  headers:
    Content-Type: application/json
