name: http-call-method-put
version: 1.0.0
description: http_call using PUT — the enrichment stub only answers PUT, anything else gets 405.
tags:
  - test-lab
  - http_call
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/source/enrichment/orders
  dataField: orders
filters:
  - type: http_call
    endpoint: http://localhost:18080/enrichment/put/profile
    method: PUT
    body: '{"customerId": "{{record.customer.id}}"}'
    dataField: profile
    mergeStrategy: merge
    cache:
      enabled: true
      key: "{{record.customer.id}}"
output:
  type: httpRequest
  endpoint: http://localhost:18080/destination/enrichment/http-merge
  method: POST
  headers:
    Content-Type: application/json
