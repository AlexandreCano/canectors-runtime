name: env-subst-endpoint
version: 1.0.0
description: The endpoint is assembled from an env reference prefix plus a literal path.
tags:
  - test-lab
  - secrets
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: "${LAB_BASE_URL}/auth/source/orders"
  dataField: orders
filters: []
output:
  type: httpRequest
  endpoint: "${LAB_BASE_URL}/auth/destination/public"
  method: POST
  headers:
    Content-Type: application/json
