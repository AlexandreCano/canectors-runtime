name: net-source-empty-response
version: 1.0.0
description: "Source returns an empty response (connection closed with no data)."
tags:
  - test-lab
  - network
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/network/source/empty-response
  dataField: data
  retry:
    maxAttempts: 0
filters: []
output:
  type: httpRequest
  endpoint: http://localhost:18080/destination/network/sink
  method: POST
  headers:
    Content-Type: application/json
