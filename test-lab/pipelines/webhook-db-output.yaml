name: webhook-db-output
version: 1.0.0
description: Webhook input writing to a database output, exercised over several requests.
tags:
  - test-lab
  - webhook
  - database
input:
  type: webhook
  path: /webhooks/db-output
  listenAddress: 127.0.0.1:18184
  dataField: orders
filters: []
output:
  type: database
  connectionString: postgres://cannectors_test:cannectors_test@localhost:15432/cannectors_test?sslmode=disable
  query: "INSERT INTO dest_customers (external_id, email, full_name, segment, synced_at) VALUES ($1, $2, $3, $4, NOW())"
  parameters:
    - record.id
    - record.email
    - record.name
    - record.segment
