name: doc-nested-total-pages
version: 1.0.0
description: totalPagesField accepts a dot path, like dataField and nextCursorField.
tags: [test-lab, doc-derived, pagination]
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/source/doc/nested-total-pages
  dataField: data
  pagination:
    type: page
    param: page
    totalPagesField: meta.total_pages
filters: []
output:
  type: httpRequest
  endpoint: http://localhost:18080/destination/matrix/sink
  method: POST
  headers: { Content-Type: application/json }
