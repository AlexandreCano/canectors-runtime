name: crash-state-id
version: 1.0.0
description: State pipeline whose source honours after_id, so crash recovery can be measured.
tags:
  - test-lab
  - state
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/source/state/events-filtered
  dataField: events
  statePersistence:
    id:
      enabled: true
      field: event.id
      queryParam: after_id
    storagePath: ./test-lab/state
filters: []
output:
  type: httpRequest
  endpoint: http://localhost:18080/destination/state/id
  method: POST
  headers:
    Content-Type: application/json
