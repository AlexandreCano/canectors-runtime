name: retry-output-exhausted-backoff
version: 1.0.0
description: Retries exhausted against a permanently failing destination, with an exponential backoffMultiplier > 1.
tags:
  - test-lab
  - retry
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/reliability/source/records
  dataField: records
filters: []
output:
  type: httpRequest
  endpoint: http://localhost:18080/reliability/destination/always-500
  method: POST
  headers:
    Content-Type: application/json
  retry:
    maxAttempts: 2
    delayMs: 50
    backoffMultiplier: 4
    maxDelayMs: 1000
    retryableStatusCodes: [500]
