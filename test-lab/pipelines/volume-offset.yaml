name: volume-offset
version: 1.0.0
description: 3 000 records over 3 pages (offset strategy) — no page may be lost.
tags:
  - test-lab
  - volume
  - reconciliation
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/source/volume/paginated-offset
  dataField: data
  pagination:
    type: offset
    param: offset
    limitParam: limit
    limit: 1000
    totalField: total
filters: []
output:
  type: httpRequest
  endpoint: http://localhost:18080/destination/volume/sink
  method: POST
  headers:
    Content-Type: application/json
