name: db-output-transaction-skip
version: 1.0.0
description: transaction=true combined with onError=skip, using the conflicting feed.
tags:
  - test-lab
  - database
  - output
  - on-error
input:
  type: httpPolling
  schedule: "* * * * * *"
  endpoint: http://localhost:18080/source/db-feed/customers-with-conflict
filters: []
output:
  type: database
  connectionString: postgres://cannectors_test:cannectors_test@localhost:15432/cannectors_test?sslmode=disable
  transaction: true
  onError: skip
  query: "INSERT INTO dest_customers (external_id, email, full_name, segment, source_updated_at, synced_at) VALUES ($1, $2, $3, $4, $5, NOW())"
  parameters:
    - record.externalId
    - record.email
    - record.fullName
    - record.segment
    - record.sourceUpdatedAt
