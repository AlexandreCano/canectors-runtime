name: filters-mapping-transforms
description: mapping applies trim/case/replace/dateFormat/join transforms and useDefault/skipField/target-only strategies.
pipeline: test-lab/pipelines/filters-mapping-transforms.yaml
expect_status: success
setup:
  reset_db: false
assertions:
  - http_count_eq: { method: POST, path: /destination/filters/mapping, expected: 1 }
  - http_count_ge: { method: POST, path: /destination/filters/mapping, body_contains: "ALICE DOE", expected: 1 }
  - http_count_ge: { method: POST, path: /destination/filters/mapping, body_contains: "alice@example.com", expected: 1 }
  - http_count_ge: { method: POST, path: /destination/filters/mapping, body_contains: "+33123456789", expected: 1 }
  - http_count_ge: { method: POST, path: /destination/filters/mapping, body_contains: "red|green|blue", expected: 1 }
  - http_count_ge: { method: POST, path: /destination/filters/mapping, body_contains: "FALLBACK", expected: 1 }
  - http_count_eq_zero: { method: POST, path: /destination/filters/mapping, body_contains: "drop-me" }
