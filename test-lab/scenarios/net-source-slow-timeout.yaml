name: net-source-slow-timeout
description: "A source slower than timeoutMs fails with a timeout."
pipeline: test-lab/pipelines/net-source-slow-timeout.yaml
expect_status: error
setup:
  reset_db: false
assertions:
  - log_contains: "request timeout"
  # A transport failure must never look like an empty but successful fetch:
  # nothing may reach the destination.
  - http_count_eq_zero: { method: POST, path: /destination/network/sink }
  - log_not_contains: "panic:"
