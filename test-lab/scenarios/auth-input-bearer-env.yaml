name: auth-input-bearer-env
description: A ${VAR} credential is resolved from the environment and authenticates the source.
pipeline: test-lab/pipelines/auth-input-bearer-env.yaml
expect_status: success
setup:
  reset_db: false
env:
  LAB_BEARER_TOKEN: lab-bearer-token
assertions:
  - http_count_eq:
      method: GET
      path: /auth/source/bearer
      headers: { Authorization: "Bearer lab-bearer-token" }
      status: 200
      expected: 1
  - http_count_ge: { method: POST, path: /auth/destination/public, expected: 1 }
  # the literal placeholder must never be sent
  - http_count_eq_zero: { method: GET, path: /auth/source/bearer, status: 401 }
