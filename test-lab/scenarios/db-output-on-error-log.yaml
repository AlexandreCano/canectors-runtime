name: db-output-on-error-log
description: onError=log — the record missing 'email' (NOT NULL) is logged and skipped; the two valid rows land in dest_customers.
pipeline: test-lab/pipelines/db-output-on-error-log.yaml
expect_status: success
setup:
  reset_db: true
assertions:
  - sql_eq: { query: "SELECT COUNT(*) FROM dest_customers WHERE external_id='DBOUT-200'", expected: "1" }
  - sql_eq: { query: "SELECT COUNT(*) FROM dest_customers WHERE external_id='DBOUT-201'", expected: "0" }
  - sql_eq: { query: "SELECT COUNT(*) FROM dest_customers WHERE external_id='DBOUT-202'", expected: "1" }
  - sql_eq: { query: "SELECT COUNT(*) FROM dest_customers WHERE external_id LIKE 'DBOUT-%'", expected: "2" }
  - log_not_contains: "panic:"
