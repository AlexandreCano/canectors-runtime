name: auth-negative-api-key-wrong
description: Negative — wrong API key on the source; 401, pipeline error, destination never called.
pipeline: test-lab/pipelines/auth-negative-api-key-wrong.yaml
expect_status: error
setup:
  reset_db: false
assertions:
  - http_count_eq: { method: GET, path: /auth/source/api-key-header, status: 401, expected: 1 }
  - http_count_eq_zero: { method: POST, path: /auth/destination/public }
