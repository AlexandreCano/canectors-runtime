name: success-status-codes-custom
description: success.statusCodes [418] makes a non-default status code count as success.
pipeline: test-lab/pipelines/success-status-codes-custom.yaml
expect_status: success
setup:
  reset_db: false
assertions:
  - http_count_eq: { method: POST, path: /destination/success/teapot, status: 418, expected: 1 }
  - log_not_contains: "panic:"
