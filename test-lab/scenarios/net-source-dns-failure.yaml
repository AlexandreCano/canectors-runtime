name: net-source-dns-failure
description: "An unresolvable host fails with a network error naming the host."
pipeline: test-lab/pipelines/net-source-dns-failure.yaml
expect_status: error
setup:
  reset_db: false
assertions:
  - log_contains: "this-host-does-not-exist.invalid"
  # A transport failure must never look like an empty but successful fetch:
  # nothing may reach the destination.
  - http_count_eq_zero: { method: POST, path: /destination/network/sink }
  - log_not_contains: "panic:"
