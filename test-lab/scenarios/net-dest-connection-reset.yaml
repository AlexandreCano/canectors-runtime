name: net-dest-connection-reset
description: "A destination that fails with connection-reset makes the run fail; no record is counted as delivered."
pipeline: test-lab/pipelines/net-dest-connection-reset.yaml
expect_status: error
setup:
  reset_db: false
assertions:
  - log_contains: "network error"
  # The output must not report records as sent when the transport failed.
  - log_not_contains: '"records_sent":1'
  - log_not_contains: "panic:"
