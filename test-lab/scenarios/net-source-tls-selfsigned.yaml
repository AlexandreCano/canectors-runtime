name: net-source-tls-selfsigned
description: "A self-signed certificate is rejected, and the log names the certificate as the cause."
pipeline: test-lab/pipelines/net-source-tls-selfsigned.yaml
expect_status: error
setup:
  reset_db: false
assertions:
  - log_contains: "failed to verify certificate"
  # A transport failure must never look like an empty but successful fetch:
  # nothing may reach the destination.
  - http_count_eq_zero: { method: POST, path: /destination/network/sink }
  - log_not_contains: "panic:"
