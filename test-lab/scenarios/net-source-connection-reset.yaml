name: net-source-connection-reset
description: "A reset connection fails the run instead of yielding zero records."
pipeline: test-lab/pipelines/net-source-connection-reset.yaml
expect_status: error
setup:
  reset_db: false
assertions:
  - log_contains: "network error"
  # A transport failure must never look like an empty but successful fetch:
  # nothing may reach the destination.
  - http_count_eq_zero: { method: POST, path: /destination/network/sink }
  - log_not_contains: "panic:"
