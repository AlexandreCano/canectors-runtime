name: auth-negative-api-key-output
description: Negative — wrong API key on the destination; 401 and the pipeline reports an error.
pipeline: test-lab/pipelines/auth-negative-api-key-output.yaml
expect_status: error
setup:
  reset_db: false
assertions:
  - http_count_eq: { method: POST, path: /auth/destination/orders, status: 401, expected: 1 }
  - http_count_eq_zero: { method: POST, path: /auth/destination/orders, status: 200 }
