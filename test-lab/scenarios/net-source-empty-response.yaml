name: net-source-empty-response
description: "An empty response is a transport failure, not an empty successful fetch."
pipeline: test-lab/pipelines/net-source-empty-response.yaml
expect_status: error
setup:
  reset_db: false
assertions:
  - log_contains: "network error"
  # A transport failure must never look like an empty but successful fetch:
  # nothing may reach the destination.
  - http_count_eq_zero: { method: POST, path: /destination/network/sink }
  - log_not_contains: "panic:"
