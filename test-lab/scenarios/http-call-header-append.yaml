name: http-call-header-append
description: http_call GET /enrichment/by-header keyed by X-Customer-Id, cache dedups 5 orders to 3 calls, appends under _response.
pipeline: test-lab/pipelines/http-call-header-append.yaml
expect_status: success
setup:
  reset_db: false
assertions:
  - http_count_eq: { method: GET, path: /enrichment/by-header, expected: 3 }
  - http_count_eq: { method: GET, path: /enrichment/by-header, headers: { X-Customer-Id: CUST-001 }, expected: 1 }
  - http_count_eq: { method: GET, path: /enrichment/by-header, headers: { X-Customer-Id: CUST-002 }, expected: 1 }
  - http_count_eq: { method: GET, path: /enrichment/by-header, headers: { X-Customer-Id: CUST-999 }, expected: 1 }
  - http_count_eq: { method: POST, path: /destination/enrichment/http-append, expected: 1 }
  - http_count_ge: { method: POST, path: /destination/enrichment/http-append, body_contains: "_response", expected: 1 }
  - http_count_ge: { method: POST, path: /destination/enrichment/http-append, body_contains: "permissions", expected: 1 }
